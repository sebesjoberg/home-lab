apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sebastians-me
spec:
  ingressClassName: traefik
  rules:
    - host: me.sebhome.homes
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sebastians-me
                port:
                  name: http
