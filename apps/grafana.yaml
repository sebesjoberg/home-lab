apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 13.5.1
      helm:
        releaseName: grafana
        valueFiles:
          - $values/infra/grafana/values.yaml
          - $values/infra/envs/k3s/grafana/values.yaml
    - repoURL: https://github.com/sebesjoberg/home-lab
      targetRevision: main
      ref: values
    - repoURL: https://github.com/sebesjoberg/home-lab
      targetRevision: main
      path: infra/grafana/sealed
    - repoURL: https://github.com/sebesjoberg/home-lab
      targetRevision: main
      path: infra/grafana/provisioning
      helm:
        releaseName: grafana-provisioning
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
