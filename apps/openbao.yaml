apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: default
  sources:
    - repoURL: https://openbao.github.io/openbao-helm
      chart: openbao
      targetRevision: 0.30.2
      helm:
        releaseName: openbao
        valueFiles:
          - $values/infra/openbao/values.yaml
          - $values/infra/envs/k3s/openbao/values.yaml
    - repoURL: https://github.com/sebesjoberg/home-lab
      targetRevision: main
      ref: values
    - repoURL: https://github.com/sebesjoberg/home-lab
      targetRevision: main
      path: infra/openbao/sealed
    - repoURL: https://github.com/sebesjoberg/home-lab
      targetRevision: main
      path: infra/envs/k3s/openbao/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
