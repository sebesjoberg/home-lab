apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.19.4
      helm:
        releaseName: harbor
        valueFiles:
          - $values/infra/harbor/values.yaml
          - $values/infra/envs/k3s/harbor/values.yaml
    - repoURL: https://github.com/sebesjoberg/home-lab
      targetRevision: main
      ref: values
    - repoURL: https://github.com/sebesjoberg/home-lab
      targetRevision: main
      path: infra/harbor/sealed
    - repoURL: https://github.com/sebesjoberg/home-lab
      targetRevision: main
      path: infra/envs/k3s/harbor/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
