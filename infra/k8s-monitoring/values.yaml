# cluster.name and env-specific scrapes are in infra/envs/<env>/k8s-monitoring/values.yaml
destinations:
  prometheus:
    type: prometheus
    url: http://prometheus-server.monitoring.svc/api/v1/write
  loki:
    type: loki
    url: http://loki.monitoring.svc:3100/loki/api/v1/push

# One Alloy for the whole cluster to save ram/cpu, reads trough kube api.
collectors:
  alloy:
    presets: [deployment]
    controller:
      replicas: 1

clusterMetrics:
  enabled: true

hostMetrics:
  enabled: true
  linuxHosts:
    enabled: true
    metricsTuning:
      useDefaultAllowList: false

podLogsViaKubernetesApi:
  enabled: true

clusterEvents:
  enabled: true

telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
