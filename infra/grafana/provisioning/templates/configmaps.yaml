{{- /*
One ConfigMap per file:
  dashboards/<Folder>/<name>.json  -> dashboard in Grafana folder <Folder> (or General if directly in dashboards/)
  alerting/<name>.yaml|.json       -> alert rules, contact points, policies, ... (Grafana provisioning format)
*/}}
{{- range $path, $_ := .Files.Glob "dashboards/**.json" }}
{{- $folder := base (dir $path) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ regexReplaceAll "[^a-z0-9]+" (trimSuffix ".json" (base $path) | lower) "-" | trunc 40 | trimSuffix "-" }}-{{ sha256sum $path | trunc 8 }}
  labels:
    grafana_dashboard: "1"
  {{- if ne $folder "dashboards" }}
  annotations:
    grafana_folder: {{ $folder | quote }}
  {{- end }}
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- range $path, $_ := .Files.Glob "alerting/*.{yaml,yml,json}" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-{{ regexReplaceAll "[^a-z0-9]+" (base $path | lower) "-" | trunc 40 | trimSuffix "-" }}-{{ sha256sum $path | trunc 8 }}
  labels:
    grafana_alert: "1"
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
