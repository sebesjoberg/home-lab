apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-config
  namespace: openbao
---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-config
  namespace: openbao
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: openbao-config
      containers:
        - name: configure
          image: quay.io/openbao/openbao:2.7.1
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc:8200
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openbao-oidc
                  key: client-secret
          volumeMounts:
            - name: bao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
          command:
            - sh
            - -ec
            - |
              until bao status >/dev/null 2>&1; do sleep 5; done
              export BAO_TOKEN=$(bao write -field=token auth/kubernetes/login role=openbao-config jwt=@/var/run/secrets/openbao/token)

              until bao write auth/oidc/config \
                oidc_discovery_url="https://auth.sebhome.homes/application/o/openbao/" \
                oidc_client_id=openbao \
                oidc_client_secret="$OIDC_CLIENT_SECRET" \
                default_role=admin; do
                sleep 10
              done

              bao write auth/oidc/role/admin - <<'EOF'
              {
                "bound_audiences": ["openbao"],
                "allowed_redirect_uris": ["https://bao.sebhome.homes/ui/vault/auth/oidc/oidc/callback", "http://localhost:8250/oidc/callback"],
                "user_claim": "preferred_username",
                "groups_claim": "groups",
                "oidc_scopes": ["profile", "email"],
                "bound_claims": { "groups": ["admins"] },
                "token_policies": ["admin"]
              }
              EOF

              # Apps that read their own secrets from OpenBao
              bao policy write sebastians-me - <<'EOF'
              path "secret/data/sebastians-me/strava" {
                capabilities = ["read", "create", "update"]
              }
              EOF
              bao write auth/kubernetes/role/sebastians-me \
                bound_service_account_names=sebastians-me \
                bound_service_account_namespaces=sebastians-me \
                audience=openbao \
                token_policies=sebastians-me \
                token_ttl=1h

              bao token revoke -self
      volumes:
        - name: bao-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: openbao
                  expirationSeconds: 600
