apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-oidc-config
  namespace: openbao
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: quay.io/openbao/openbao:2.7.1
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc:8200
            - name: USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openbao-bootstrap
                  key: user-password
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openbao-oidc
                  key: client-secret
          command:
            - sh
            - -ec
            - |
              until bao status >/dev/null 2>&1; do sleep 5; done
              export BAO_TOKEN=$(bao login -token-only -method=userpass username=sebesjoberg password="$USER_PASSWORD")

              bao auth list | grep -q '^oidc/' || bao auth enable oidc

              until bao write auth/oidc/config \
                oidc_discovery_url="https://auth.sebhome.homes/application/o/openbao/" \
                oidc_client_id=openbao \
                oidc_client_secret="$OIDC_CLIENT_SECRET" \
                default_role=admin; do
                sleep 10
              done

              bao write auth/oidc/role/admin - <<'EOF'
              {
                "bound_audiences": ["openbao"],
                "allowed_redirect_uris": ["https://bao.sebhome.homes/ui/vault/auth/oidc/oidc/callback", "http://localhost:8250/oidc/callback"],
                "user_claim": "preferred_username",
                "groups_claim": "groups",
                "oidc_scopes": ["profile", "email"],
                "bound_claims": { "groups": ["admins"] },
                "token_policies": ["admin"]
              }
              EOF

              bao token revoke -self
