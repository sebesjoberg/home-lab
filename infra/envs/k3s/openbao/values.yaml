server:
  ingress:
    hosts:
      - host: bao.sebhome.homes
        paths: []

  standalone:
    config: |
      ui = true

      listener "tcp" {
        tls_disable     = 1
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "pebbledb" {
        path = "/openbao/data/pebbledb"
      }

      seal "static" {
        current_key_id = "homelab-1"
        current_key    = "env://UNSEAL_KEY"
      }

      initialize "secrets" {
        request "enable-kv" {
          operation = "update"
          path      = "sys/mounts/secret"
          data = {
            type    = "kv"
            options = { version = "2" }
          }
        }
      }

      initialize "policies" {
        request "admin" {
          operation = "update"
          path      = "sys/policies/acl/admin"
          data = {
            policy = <<EOT
      path "*" {
        capabilities = ["create", "read", "update", "patch", "delete", "list", "sudo"]
      }
      EOT
          }
        }
        request "external-secrets-read" {
          operation = "update"
          path      = "sys/policies/acl/external-secrets-read"
          data = {
            policy = <<EOT
      path "secret/data/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/*" {
        capabilities = ["read", "list"]
      }
      EOT
          }
        }
        request "oidc-config" {
          operation = "update"
          path      = "sys/policies/acl/oidc-config"
          data = {
            policy = <<EOT
      path "auth/oidc/config" {
        capabilities = ["create", "update", "read"]
      }
      path "auth/oidc/role/*" {
        capabilities = ["create", "update", "read"]
      }
      EOT
          }
        }
      }

      # OIDC is configured by the openbao-oidc-config job, since Authentik
      # isn't reachable yet when OpenBao initializes.
      initialize "oidc" {
        request "enable" {
          operation = "update"
          path      = "sys/auth/oidc"
          data      = { type = "oidc" }
        }
      }

      initialize "kubernetes" {
        request "enable" {
          operation = "update"
          path      = "sys/auth/kubernetes"
          data      = { type = "kubernetes" }
        }
        request "config" {
          operation = "update"
          path      = "auth/kubernetes/config"
          data      = { kubernetes_host = "https://kubernetes.default.svc" }
        }
        request "external-secrets-role" {
          operation = "update"
          path      = "auth/kubernetes/role/external-secrets"
          data = {
            bound_service_account_names      = ["external-secrets"]
            bound_service_account_namespaces = ["external-secrets"]
            audience                         = "openbao"
            token_policies                   = ["external-secrets-read"]
            token_ttl                        = "1h"
          }
        }
        request "oidc-config-role" {
          operation = "update"
          path      = "auth/kubernetes/role/oidc-config"
          data = {
            bound_service_account_names      = ["openbao-oidc-config"]
            bound_service_account_namespaces = ["openbao"]
            audience                         = "openbao"
            token_policies                   = ["oidc-config"]
            token_ttl                        = "10m"
          }
        }
      }
