ingress:
  hosts:
    - grafana.sebhome.homes

grafana.ini:
  server:
    root_url: https://grafana.sebhome.homes
  auth:
    signout_redirect_url: https://auth.sebhome.homes/application/o/grafana/end-session/
  auth.generic_oauth:
    auth_url: https://auth.sebhome.homes/application/o/authorize/
    token_url: https://auth.sebhome.homes/application/o/token/
    api_url: https://auth.sebhome.homes/application/o/userinfo/
