injector:
  enabled: false

server:
  dataStorage:
    size: 1Gi

  extraSecretEnvironmentVars:
    - envName: UNSEAL_KEY
      secretName: openbao-bootstrap
      secretKey: unseal-key
    - envName: USER_PASSWORD
      secretName: openbao-bootstrap
      secretKey: user-password
    - envName: OIDC_CLIENT_SECRET
      secretName: openbao-oidc
      secretKey: client-secret
  extraInitContainers:
    - name: wait-for-authentik
      image: busybox:1.37.0
      command:
        - sh
        - -c
        - timeout 600 sh -c 'until wget -q -O /dev/null http://auth.localtest.me:8080/application/o/openbao/.well-known/openid-configuration; do sleep 5; done' || true

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: bao.localtest.me
        paths: []

  standalone:
    config: |
      ui = true

      listener "tcp" {
        tls_disable     = 1
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "pebbledb" {
        path = "/openbao/data/pebbledb"
      }

      seal "static" {
        current_key_id = "homelab-1"
        current_key    = "env://UNSEAL_KEY"
      }

      initialize "secrets" {
        request "enable-kv" {
          operation = "update"
          path      = "sys/mounts/secret"
          data = {
            type    = "kv"
            options = { version = "2" }
          }
        }
      }

      initialize "policies" {
        request "admin" {
          operation = "update"
          path      = "sys/policies/acl/admin"
          data = {
            policy = <<EOT
      path "*" {
        capabilities = ["create", "read", "update", "patch", "delete", "list", "sudo"]
      }
      EOT
          }
        }
        request "external-secrets-read" {
          operation = "update"
          path      = "sys/policies/acl/external-secrets-read"
          data = {
            policy = <<EOT
      path "secret/data/*" {
        capabilities = ["read"]
      }
      path "secret/metadata/*" {
        capabilities = ["read", "list"]
      }
      EOT
          }
        }
      }

      initialize "userpass" {
        request "enable" {
          operation = "update"
          path      = "sys/auth/userpass"
          data      = { type = "userpass" }
        }
        request "personal-user" {
          operation = "update"
          path      = "auth/userpass/users/sebesjoberg"
          data = {
            password = {
              eval_type       = "string"
              eval_source     = "env"
              env_var         = "USER_PASSWORD"
              require_present = true
            }
            token_policies = ["admin"]
          }
        }
      }

      initialize "kubernetes" {extraSecretEnvironmentVars
        request "enable" {
          operation = "update"
          path      = "sys/auth/kubernetes"
          data      = { type = "kubernetes" }
        }
        request "config" {
          operation = "update"
          path      = "auth/kubernetes/config"
          data      = { kubernetes_host = "https://kubernetes.default.svc" }
        }
        request "external-secrets-role" {
          operation = "update"
          path      = "auth/kubernetes/role/external-secrets"
          data = {
            bound_service_account_names      = ["external-secrets"]
            bound_service_account_namespaces = ["external-secrets"]
            audience                         = "openbao"
            token_policies                   = ["external-secrets-read"]
            token_ttl                        = "1h"
          }
        }
      }
      initialize "oidc" {
        request "enable" {
          operation = "update"
          path      = "sys/auth/oidc"
          data      = { type = "oidc" }
        }
        request "config" {
          operation = "update"
          path      = "auth/oidc/config"
          data = {
            oidc_discovery_url = "http://auth.localtest.me:8080/application/o/openbao/"
            oidc_client_id     = "openbao"
            oidc_client_secret = {
              eval_type       = "string"
              eval_source     = "env"
              env_var         = "OIDC_CLIENT_SECRET"
              require_present = true
            }
            default_role = "admin"
          }
        }
        request "admin-role" {
          operation = "update"
          path      = "auth/oidc/role/admin"
          data = {
            bound_audiences       = ["openbao"]
            allowed_redirect_uris = ["http://bao.localtest.me:8080/ui/vault/auth/oidc/oidc/callback", "http://localhost:8250/oidc/callback"]
            user_claim            = "preferred_username"
            groups_claim          = "groups"
            oidc_scopes           = ["profile", "email"]
            bound_claims          = { groups = ["admins"] }
            token_policies        = ["admin"]
          }
        }
      }
