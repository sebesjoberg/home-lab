configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 180s
    admin.enabled: "false"
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
    # Argo ignores /status updates by default, so a CRD cached before it became
    # Established stays Progressing forever and blocks sync waves on a fresh cluster.
    resource.customizations.health.apiextensions.k8s.io_CustomResourceDefinition: |
      hs = {}
      hs.status = "Healthy"
      return hs
  rbac:
    policy.default: ""
    policy.csv: |
      g, admins, role:admin

server:
  ingress:
    enabled: true
    ingressClassName: traefik
dex:
  enabled: false
notifications:
  enabled: false
