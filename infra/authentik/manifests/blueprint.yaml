apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  homelab-users.yaml: |
    version: 1
    metadata:
      name: homelab-users
    entries:
      - model: authentik_core.group
        id: admins
        identifiers:
          name: admins
        attrs:
          is_superuser: true
      - model: authentik_core.user
        identifiers:
          username: sebesjoberg
        attrs:
          name: Sebastian
          email: sebesjoberg@gmail.com
          groups:
            - !KeyOf admins
          password_hash: !Env HOMELAB_USER_PASSWORD_HASH
  homelab-apps.yaml: |
    version: 1
    metadata:
      name: homelab-apps
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: argocd-provider
        identifiers:
          name: argocd
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: argocd
          client_secret: !Env ARGOCD_CLIENT_SECRET
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: http://argocd.localtest.me:8080/auth/callback
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          provider: !KeyOf argocd-provider
          meta_launch_url: http://argocd.localtest.me:8080

      - model: authentik_providers_oauth2.oauth2provider
        id: openbao-provider
        identifiers:
          name: openbao
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: openbao
          client_secret: !Env OPENBAO_CLIENT_SECRET
          client_type: confidential
          grant_types:
            - authorization_code
            - refresh_token
          redirect_uris:
            - matching_mode: strict
              url: http://bao.localtest.me:8080/ui/vault/auth/oidc/oidc/callback
              redirect_uri_type: authorization
            - matching_mode: strict
              url: http://localhost:8250/oidc/callback
              redirect_uri_type: authorization
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        identifiers:
          slug: openbao
        attrs:
          name: OpenBao
          provider: !KeyOf openbao-provider
          meta_launch_url: http://bao.localtest.me:8080

      - model: authentik_providers_proxy.proxyprovider
        id: traefik-provider
        identifiers:
          name: traefik-dashboard
        attrs:
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: http://traefik.localtest.me:8080
      - model: authentik_core.application
        identifiers:
          slug: traefik
        attrs:
          name: Traefik
          provider: !KeyOf traefik-provider
          meta_launch_url: http://traefik.localtest.me:8080/dashboard/

      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          providers:
            - !KeyOf traefik-provider
          config:
            authentik_host: http://auth.localtest.me:8080/
