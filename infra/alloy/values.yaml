alloy:
  # 1. Tvinga chartet att montera in nodens loggmapp (/var/log/pods) i containrarna!
  mounts:
    varlog: true

  # 2. Sätt rätt stabilitetsnivå så att Loki-komponenter tillåts köras
  stabilityLevel: "public-preview"

  # 3. Klistra in din logg-pipeline under configMap.content
  configMap:
    create: true
    content: |
      // API-upptäckt av poddar i ditt k3s/kind-kluster
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Matcha filerna på nodens disk och tagga dem med metadata
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      // Strömma loggarna från filerna
      loki.source.file "kubernetes_pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.local_loki.receiver]
      }

      // Skicka allt till din fungerande interna Loki-service
      loki.write "local_loki" {
        endpoint {
          url = "http://cluster.local"
        }
      }
