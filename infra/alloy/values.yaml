alloy:
  mounts:
    varlog: true

  stabilityLevel: "public-preview"

  configMap:
    create: true
    content: |
      // 1. Hämta alla aktiva poddar i klustret
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2. Översätt Kubernetes-metadata till rätt loggmappar på disken
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Denna regel hittar rätt loggfil baserat på namespace, podnamn och containernamn
         rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_container_name"]
          separator     = "_"
          action        = "replace"
          replacement   = "/var/log/pods/$$1_$$2_*/$$3/*.log"
          target_label  = "__path__"
        }

        // Spara snygga etiketter till Loki
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      // 3. Starta loggmotorn och läs filerna
      loki.source.file "kubernetes_pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.local_loki.receiver]
      }

      // 4. Skicka loggarna till din fungerande Loki-service
      loki.write "local_loki" {
        endpoint {
          url = "http://cluster.local"
        }
      }
