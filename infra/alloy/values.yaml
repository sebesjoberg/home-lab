alloy:
  mounts:
    varlog: true

  stabilityLevel: "public-preview"

  configMap:
    create: true
    content: |
      // 1. Upptäck alla aktiva poddar i klustret
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // 2. Använd Alloys inbyggda standardkomponent för Kubernetes-loggar!
      loki.source.kubernetes "local_pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.write.local_loki.receiver]
      }

      // 3. Skicka allting direkt till din Loki-service
      loki.write "local_loki" {
        endpoint {
          url = "http://loki-service.monitoring.svc.cluster.local:3100"
        }
      }
