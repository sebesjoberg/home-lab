controller:
  type: deployment
  replicas: 1

alloy:
  stabilityLevel: "public-preview"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  configMap:
    create: true
    content: |
      discovery.kubernetes "pods" {
        role = "pod"

        // FILTER A: only collect from these namespaces.
        // namespaces {
        //   names = ["authentik", "argocd"]
        // }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "(.+)"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(.+)"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "job"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.drop_noise.receiver]
      }

      // Drops log lines that match the regex. Add more with |.
      loki.process "drop_noise" {
        stage.drop {
          expression          = "kube-probe|goauthentik.io/healthcheck|grpc.health.v1.Health"
          drop_counter_reason = "healthchecks"
        }

        forward_to = [loki.write.local_loki.receiver]
      }

      loki.write "local_loki" {
        endpoint {
          url = "http://loki-service.monitoring:3100/loki/api/v1/push"
        }
      }
        forward_to = [loki.process.drop_noise.receiver]
      }

      // Drops log lines that match the regex. Add more with |.
      loki.process "drop_noise" {
        stage.drop {
          expression          = "kube-probe|goauthentik.io/healthcheck|grpc.health.v1.Health"
          drop_counter_reason = "healthchecks"
        }

        forward_to = [loki.write.local_loki.receiver]
      }

      loki.write "local_loki" {
        endpoint {
          url = "http://loki-service.monitoring:3100/loki/api/v1/push"
        }
      }
