apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yaml: |
    scrape_configs:
      - job_name: proxmox
        static_configs:
          - targets: ["192.168.0.10:9100"]
            labels:
              instance: proxmox
          - targets: ["192.168.0.20:9100"]
            labels:
              instance: controlplane
          - targets: ["192.168.0.21:9100"]
            labels:
              instance: worker-1
          - targets: ["192.168.0.22:9100"]
            labels:
              instance: worker-2
