apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-manual-ingress
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.sebhome.homes # Din URL
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
